<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Китайский с Сашей</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #fffaf0; /* Цвет слоновой кости (бумага) */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        .card {
            transition: transform 0.2s;
        }
        .card:active {
            transform: scale(0.98);
        }
        .hidden { display: none; }
        
        /* Стили для анимации карточек */
        .flip-card {
            perspective: 1000px;
        }
        .flip-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }
        .is-flipped .flip-card-inner {
            transform: rotateY(180deg);
        }
        .flip-card-front, .flip-card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            border-radius: 2rem;
            border: 4px solid #b91c1c; /* Красный бордер */
            background-color: white;
            box-shadow: 0 15px 30px -5px rgba(0, 0, 0, 0.2);
        }
        .flip-card-back {
            transform: rotateY(180deg);
            background-color: #fff1f2; /* Светло-розовый/красный фон */
        }
    </style>
</head>
<body class="p-4">
    <div id="app" class="max-w-md mx-auto">
        <!-- Header -->
        <header class="mb-8 text-center p-6 bg-red-700 rounded-3xl shadow-xl border-4 border-yellow-500">
            <h1 class="text-4xl font-bold text-yellow-400 drop-shadow-md">Китайский с Сашей</h1>
        </header>

        <!-- Theme Selection -->
        <div id="theme-selection">
            <h2 class="text-xl font-bold mb-4 text-red-800">Выберите тему:</h2>
            <div id="theme-list" class="grid grid-cols-1 gap-3">
                <!-- Темы будут вставлены сюда -->
            </div>
        </div>

        <!-- Word Study -->
        <div id="word-view" class="hidden">
            <button onclick="showThemes()" class="mb-4 text-red-700 font-bold">← Назад к темам</button>
            <h2 id="current-theme-title" class="text-2xl font-bold mb-4 text-red-800">Тема</h2>

            <div class="mb-6">
                <div class="flex flex-col gap-3">
                    <button onclick="startTraining()" class="w-full bg-yellow-500 text-red-900 p-4 rounded-xl font-bold shadow-lg hover:bg-yellow-400 transition transform hover:scale-105">
                        🚀 Начать тренировку (карточки)
                    </button>
                    <button onclick="startQuiz()" class="w-full bg-green-600 text-white p-4 rounded-xl font-bold shadow-lg hover:bg-green-700 transition transform hover:scale-105">
                        📝 Пройти тест (10 вопросов)
                    </button>
                </div>
            </div>

            <div id="word-cards" class="space-y-4">
                <!-- Слова будут вставлены сюда -->
            </div>
        </div>

        <!-- Training Mode (Flashcards) -->
        <div id="training-mode" class="hidden">
            <button onclick="showThemes()" class="mb-4 text-red-700 font-bold">← Назад к темам</button>
            <h2 id="training-theme-title" class="text-2xl font-bold mb-4 text-red-800">Тренировка</h2>
            
            <div class="mb-2 text-right text-gray-500 font-bold" id="progress-text">1 / 1</div>

            <div id="card-container" class="flip-card w-full h-[400px]">
                <div id="flashcard-inner" class="flip-card-inner w-full h-full">
                    <div class="flip-card-front">
                        <span class="text-6xl mb-4">🐼</span>
                        <h3 id="card_zh" class="text-5xl font-bold mb-4 text-gray-800">...</h3>
                        <p id="card_py" class="text-xl text-gray-500"></p>
                        <button onclick="speak()" class="mt-4 bg-white border-2 border-red-600 p-2 rounded-full shadow-sm hover:bg-red-50">
                            🔊 Озвучка
                        </button>
                        <p class="mt-8 text-sm text-red-500 font-bold">Нажми на карточку, чтобы увидеть перевод</p>
                    </div>
                    <div class="flip-card-back">
                        <h3 id="card_ru" class="text-3xl font-bold mb-4 text-gray-800">...</h3>
                        <p id="card_ex_ru" class="text-lg text-gray-600"></p>
                        <p id="card_ex_zh" class="text-sm text-gray-400 mt-4"></p>
                    </div>
                </div>
            </div>

            <div class="flex justify-between items-center gap-2 mt-4">
                <button onclick="prevWord()" class="bg-gray-200 px-6 py-3 rounded-full font-bold hover:bg-gray-300">Назад</button>
                <button onclick="flipCard()" class="bg-red-700 text-white px-8 py-3 rounded-full font-bold shadow-lg hover:bg-red-800">Перевернуть</button>
                <button onclick="nextWord()" class="bg-gray-200 px-6 py-3 rounded-full font-bold hover:bg-gray-300">Вперед</button>
            </div>
        </div>

        <!-- Quiz Mode -->
        <div id="quiz-mode" class="hidden">
            <button onclick="showThemes()" class="mb-4 text-red-700 font-bold">← Назад к темам</button>
            <h2 id="quiz-theme-title" class="text-2xl font-bold mb-4 text-red-800">Тест</h2>
            <div class="mb-4 text-right text-gray-500 font-bold" id="quiz-progress-text">1 / 10</div>

            <div id="quiz-question-container" class="bg-white p-8 rounded-3xl shadow-xl border-4 border-green-600 text-center">
                <p class="text-gray-500 mb-4">Переведите слово:</p>
                <h3 id="quiz_zh" class="text-6xl font-bold mb-8 text-gray-800">...</h3>
                <div id="quiz-options" class="grid grid-cols-1 gap-4">
                    <!-- Варианты ответов -->
                </div>
            </div>
        </div>

        <!-- Quiz Result -->
        <div id="quiz-result" class="hidden text-center p-8 bg-white rounded-3xl shadow-xl border-4 border-yellow-500">
            <h2 class="text-4xl font-bold mb-4 text-red-800">Результат теста</h2>
            <p id="quiz-score-text" class="text-3xl mb-8">Правильно: 0 / 10</p>
            <button onclick="showThemes()" class="w-full bg-red-700 text-white p-4 rounded-xl font-bold">Вернуться к темам</button>
        </div>
    </div>

    <script>
        let allData = {};
        let currentTheme = "";
        let trainingTheme = "";
        let currentWordIndex = 0;
        let filteredTrainingWords = [];

        // Глобальные переменные для теста
        let quizWords = [];
        let currentQuizIndex = 0;
        let score = 0;

        async function loadData() {
            try {
                const response = await fetch('data.json');
                allData = await response.json();
                renderThemes();
            } catch (e) {
                console.error("Error loading JSON", e);
                document.getElementById('theme-list').innerHTML = "<p class='text-red-600 font-bold'>Ошибка загрузки данных. Убедитесь, что data.json находится в той же папке.</p>";
            }
        }

        function renderThemes() {
            const list = document.getElementById('theme-list');
            list.innerHTML = '';
            Object.keys(allData).forEach(theme => {
                const btn = document.createElement('button');
                btn.className = "bg-white p-4 rounded-xl shadow border border-gray-200 text-left hover:bg-red-50 transition border-l-4 border-l-red-600";
                btn.innerText = theme;
                btn.onclick = () => showWords(theme);
                list.appendChild(btn);
            });
        }

        function showWords(theme) {
            currentTheme = theme;
            document.getElementById('theme-selection').classList.add('hidden');
            document.getElementById('word-view').classList.remove('hidden');
            document.getElementById('training-mode').classList.add('hidden');
            document.getElementById('current-theme-title').innerText = theme;

            const container = document.getElementById('word-cards');
            container.innerHTML = '';

            allData[theme].forEach(word => {
                if (!word.pinyin || !word.russian) return;

                const div = document.createElement('div');
                div.className = "bg-white p-4 rounded-xl shadow border border-gray-200 hover:border-red-400 transition";
                div.innerHTML = `
                    <div class="flex justify-between items-center mb-2">
                        <span class="text-2xl font-bold text-gray-800">${word.chinese}</span>
                        <span class="text-gray-500">${word.pinyin}</span>
                    </div>
                    <p class="text-red-700 font-medium mb-2">${word.russian}</p>
                    ${word.ex_zh ? `<p class="text-sm text-gray-700">Пример: ${word.ex_zh}</p>` : ''}
                    ${word.ex_ru ? `<p class="text-sm text-gray-500">Перевод: ${word.ex_ru}</p>` : ''}
                `;
                container.appendChild(div);
            });
        }

        function startTraining() {
            trainingTheme = currentTheme;
            filteredTrainingWords = allData[trainingTheme].filter(word => word.pinyin && word.russian);
            
            if (filteredTrainingWords.length === 0) {
                alert("В этой теме нет слов для тренировки.");
                return;
            }

            currentWordIndex = 0;
            document.getElementById('word-view').classList.add('hidden');
            document.getElementById('training-mode').classList.remove('hidden');
            document.getElementById('training-theme-title').innerText = "Тренировка: " + trainingTheme;
            updateFlashcard();
        }

        function showThemes() {
            document.getElementById('theme-selection').classList.remove('hidden');
            document.getElementById('word-view').classList.add('hidden');
            document.getElementById('training-mode').classList.add('hidden');
        }

        function updateFlashcard() {
            const word = filteredTrainingWords[currentWordIndex];
            document.getElementById('card_zh').innerText = word.chinese;
            document.getElementById('card_py').innerText = word.pinyin;
            document.getElementById('card_ru').innerText = word.russian;
            document.getElementById('card_ex_ru').innerText = word.ex_ru || "";
            document.getElementById('card_ex_zh').innerText = word.ex_zh ? `Пример: ${word.ex_zh}` : "";
            
            document.getElementById('progress-text').innerText = `Карточка ${currentWordIndex + 1} из ${filteredTrainingWords.length}`;
            
            document.getElementById('card-container').classList.remove('is-flipped');
        }

        function flipCard() {
            document.getElementById('card-container').classList.toggle('is-flipped');
        }

        function speak() {
            const word = filteredTrainingWords[currentWordIndex];
            if (word && word.chinese) {
                const utterance = new SpeechSynthesisUtterance(word.chinese);
                utterance.lang = 'zh-CN';
                window.speechSynthesis.cancel();
                window.speechSynthesis.speak(utterance);
            }
        }

        function nextWord() {
            if (currentWordIndex < filteredTrainingWords.length - 1) {
                currentWordIndex++;
                updateFlashcard();
            }
        }

        function prevWord() {
            if (currentWordIndex > 0) {
                currentWordIndex--;
                updateFlashcard();
            }
        }

        // --- Логика Теста (Quiz) ---

        function startQuiz() {
            const wordsInTheme = allData[currentTheme].filter(word => word.pinyin && word.russian);
            
            if (wordsInTheme.length < 10) {
                alert("В этой теме меньше 10 слов. Пожалуйста, выберите другую тему.");
                return;
            }

            // Выбираем 10 случайных слов
            quizWords = [...wordsInTheme].sort(() => 0.5 - Math.random()).slice(0, 10);
            currentQuizIndex = 0;
            score = 0;

            document.getElementById('word-view').classList.add('hidden');
            document.getElementById('quiz-mode').classList.remove('hidden');
            document.getElementById('quiz-theme-title').innerText = "Тест: " + currentTheme;
            
            showQuizQuestion();
        }

        function showQuizQuestion() {
            const word = quizWords[currentQuizIndex];
            document.getElementById('quiz_zh').innerText = word.chinese;
            document.getElementById('quiz-progress-text').innerText = `Вопрос ${currentQuizIndex + 1} из 10`;
            
            const optionsContainer = document.getElementById('quiz-options');
            optionsContainer.innerHTML = '';

            // Генерируем варианты ответов
            let options = [word.russian];
            const wordsInTheme = allData[currentTheme].filter(w => w.pinyin && w.russian);
            
            while (options.length < 4) {
                let randomWord = wordsInTheme[Math.floor(Math.random() * wordsInTheme.length)].russian;
                if (!options.includes(randomWord)) {
                    options.push(randomWord);
                }
            }

            // Перемешиваем варианты
            options.sort(() => 0.5 - Math.random());

            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = "bg-white border-2 border-gray-200 p-4 rounded-xl font-bold hover:border-green-500 hover:bg-green-50 transition";
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(opt, word.russian);
                optionsContainer.appendChild(btn);
            });
        }

        function checkAnswer(selected, correct) {
            if (selected === correct) {
                score++;
            }

            currentQuizIndex++;
            if (currentQuizIndex < 10) {
                showQuizQuestion();
            } else {
                showQuizResult();
            }
        }

        function showQuizResult() {
            document.getElementById('quiz-mode').classList.add('hidden');
            document.getElementById('quiz-result').classList.remove('hidden');
            document.getElementById('quiz-score-text').innerText = `Правильно: ${score} / 10`;
        }

        loadData();
    </script>
</body
</html>
