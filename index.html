<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HSK1 Trainer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #f3f4f6;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        .card {
            transition: transform 0.2s;
        }
        .card:active {
            transform: scale(0.98);
        }
        .hidden { display: none; }
        
        /* Стили для анимации карточек */
        .flip-card {
            perspective: 1000px;
        }
        .flip-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }
        .is-flipped .flip-card-inner {
            transform: rotateY(180deg);
        }
        .flip-card-front, .flip-card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            border-radius: 1.5rem;
            border: 2px solid #3b82f6;
            background-color: white;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }
        .flip-card-back {
            transform: rotateY(180deg);
            background-color: #eff6ff; /* Светло-синий фон для оборота */
        }
    </style>
</head>
<body class="p-4">
    <div id="app" class="max-w-md mx-auto">
        <!-- Header -->
        <header class="mb-6 text-center">
            <h1 class="text-3xl font-bold text-blue-600">HSK1 Trainer</h1>
            <p class="text-gray-600">Учите китайский эффективно</p>
        </header>

        <!-- Theme Selection -->
        <div id="theme-selection">
            <h2 class="text-xl font-semibold mb-4">Выберите тему:</h2>
            <div id="theme-list" class="grid grid-cols-1 gap-3">
                <!-- Темы будут вставлены сюда -->
            </div>
        </div>

        <!-- Word Study -->
        <div id="word-view" class="hidden">
            <button onclick="showThemes()" class="mb-4 text-blue-600 font-medium">← Назад к темам</button>
            <h2 id="current-theme-title" class="text-2xl font-bold mb-4">Тема</h2>
            
            <div class="mb-6">
                <button onclick="startTraining()" class="w-full bg-green-600 text-white p-4 rounded-xl font-bold shadow hover:bg-green-700 transition">
                    🚀 Начать тренировку (карточки)
                </button>
            </div>

            <div id="word-cards" class="space-y-4">
                <!-- Слова будут вставлены сюда -->
            </div>
        </div>

        <!-- Training Mode (Flashcards) -->
        <div id="training-mode" class="hidden">
            <button onclick="showThemes()" class="mb-4 text-blue-600 font-medium">← Назад к темам</button>
            <h2 id="training-theme-title" class="text-2xl font-bold mb-4">Тренировка</h2>
            
            <div class="mb-2 text-right text-gray-500 font-medium" id="progress-text">1 / 1</div>

            <div class="flip-card w-full h-[400px]">
                <div id="flashcard-inner" class="flip-card-inner w-full h-full">
                    <div class="flip-card-front">
                        <h3 id="card_zh" class="text-5xl font-bold mb-4 text-gray-800">...</h3>
                        <p id="card_py" class="text-xl text-gray-500"></p>
                        <p class="mt-8 text-sm text-blue-400">Нажми, чтобы увидеть перевод</p>
                    </div>
                    <div class="flip-card-back">
                        <h3 id="card_ru" class="text-2xl font-bold mb-4 text-gray-800">...</h3>
                        <p id="card_ex_ru" class="text-lg text-gray-600"></p>
                        <p id="card_ex_zh" class="text-sm text-gray-400 mt-4"></p>
                    </div>
                </div>
            </div>

            <div class="flex justify-between items-center gap-2">
                <button onclick="prevWord()" class="bg-gray-200 px-6 py-3 rounded-full font-bold hover:bg-gray-300">Назад</button>
                <button onclick="flipCard()" class="bg-blue-600 text-white px-8 py-3 rounded-full font-bold hover:bg-blue-700 shadow-lg">Перевернуть</button>
                <button onclick="nextWord()" class="bg-gray-200 px-6 py-3 rounded-full font-bold hover:bg-gray-300">Вперед</button>
            </div>
        </div>
    </div>

    <script>
        let allData = {};
        let currentTheme = "";
        let trainingTheme = "";
        let currentWordIndex = 0;
        let filteredTrainingWords = [];

        async function loadData() {
            try {
                const response = await fetch('data.json');
                allData = await response.json();
                renderThemes();
            } catch (e) {
                console.error("Error loading JSON", e);
                document.getElementById('theme-list').innerHTML = "<p>Ошибка загрузки данных. Убедитесь, что data.json находится в той же папке.</p>";
            }
        }

        function renderThemes() {
            const list = document.getElementById('theme-list');
            list.innerHTML = '';
            Object.keys(allData).forEach(theme => {
                const btn = document.createElement('button');
                btn.className = "bg-white p-4 rounded-xl shadow border border-gray-200 text-left hover:bg-blue-50 transition";
                btn.innerText = theme;
                btn.onclick = () => showWords(theme);
                list.appendChild(btn);
            });
        }

        function showWords(theme) {
            currentTheme = theme;
            document.getElementById('theme-selection').classList.add('hidden');
            document.getElementById('word-view').classList.remove('hidden');
            document.getElementById('training-mode').classList.add('hidden');
            document.getElementById('current-theme-title').innerText = theme;

            const container = document.getElementById('word-cards');
            container.innerHTML = '';

            allData[theme].forEach(word => {
                // Фильтруем "заголовки" (у которых нет пиньиня или перевода)
                if (!word.pinyin || !word.russian) return;

                const div = document.createElement('div');
                div.className = "bg-white p-4 rounded-xl shadow border border-gray-200";
                div.innerHTML = `
                    <div class="flex justify-between items-center mb-2">
                        <span class="text-2xl font-bold">${word.chinese}</span>
                        <span class="text-gray-500">${word.pinyin}</span>
                    </div>
                    <p class="text-blue-600 mb-2">${word.russian}</p>
                    ${word.ex_zh ? `<p class="text-sm text-gray-700">Пример: ${word.ex_zh}</p>` : ''}
                    ${word.ex_ru ? `<p class="text-sm text-gray-500">Перевод: ${word.ex_ru}</p>` : ''}
                `;
                container.appendChild(div);
            });
        }

        function startTraining() {
            trainingTheme = currentTheme;
            // Фильтруем только реальные слова для тренировки
            filteredTrainingWords = allData[trainingTheme].filter(word => word.pinyin && word.russian);
            
            if (filteredTrainingWords.length === 0) {
                alert("В этой теме нет слов для тренировки.");
                return;
            }

            currentWordIndex = 0;
            document.getElementById('word-view').classList.add('hidden');
            document.getElementById('training-mode').classList.remove('hidden');
            document.getElementById('training-theme-title').innerText = "Тренировка: " + trainingTheme;
            updateFlashcard();
        }

        function showThemes() {
            document.getElementById('theme-selection').classList.remove('hidden');
            document.getElementById('word-view').classList.add('hidden');
            document.getElementById('training-mode').classList.add('hidden');
        }

        function updateFlashcard() {
            const word = filteredTrainingWords[currentWordIndex];
            document.getElementById('card_zh').innerText = word.chinese;
            document.getElementById('card_py').innerText = word.pinyin;
            document.getElementById('card_ru').innerText = word.russian;
            document.getElementById('card_ex_ru').innerText = word.ex_ru || "";
            document.getElementById('card_ex_zh').innerText = word.ex_zh ? `Пример: ${word.ex_zh}` : "";
            
            document.getElementById('progress-text').innerText = `Карточка ${currentWordIndex + 1} из ${filteredTrainingWords.length}`;
            
            // Сброс анимации переворота при переходе к новому слову
            document.getElementById('flashcard-inner').classList.remove('is-flipped');
        }

        function flipCard() {
            document.getElementById('flashcard-inner').classList.toggle('is-flipped');
        }

        function nextWord() {
            if (currentWordIndex < filteredTrainingWords.length - 1) {
                currentWordIndex++;
                updateFlashcard();
            }
        }

        function prevWord() {
            if (currentWordIndex > 0) {
                currentWordIndex--;
                updateFlashcard();
            }
        }

        loadData();
    </script>
</body
</html>
